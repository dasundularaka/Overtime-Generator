<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Document Sheet -->
  <rect x="110" y="80" width="292" height="352" rx="18" fill="#ffffff" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.4))"/>
  
  <!-- Document Header Lines -->
  <rect x="146" y="120" width="140" height="16" rx="4" fill="#0284c7"/>
  <rect x="146" y="146" width="220" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="146" y="166" width="180" height="10" rx="3" fill="#e2e8f0"/>
  
  <!-- Document Grid / Table lines -->
  <line x1="146" y1="200" x2="366" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="146" y1="230" x2="366" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="146" y1="260" x2="366" y2="260" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="146" y1="290" x2="366" y2="290" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="146" y1="320" x2="366" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Clock Emblem (Overtime) -->
  <circle cx="340" cy="330" r="76" fill="url(#accent)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
  <circle cx="340" cy="330" r="66" fill="#1e293b"/>
  <!-- Clock ticks -->
  <circle cx="340" cy="274" r="3" fill="#94a3b8"/>
  <circle cx="396" cy="330" r="3" fill="#94a3b8"/>
  <circle cx="340" cy="386" r="3" fill="#94a3b8"/>
  <circle cx="284" cy="330" r="3" fill="#94a3b8"/>
  <!-- Clock hands at 05:30 / Overtime badge -->
  <line x1="340" y1="330" x2="340" y2="295" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="340" y1="330" x2="370" y2="345" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="340" cy="330" r="7" fill="#f8fafc"/>
  
  <!-- Stamp / Check badge -->
  <circle cx="160" cy="370" r="28" fill="url(#glow)"/>
  <path d="M148 370 L157 379 L173 363" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
