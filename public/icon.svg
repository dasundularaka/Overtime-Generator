<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <style>
    @keyframes iconHourSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes iconMinuteSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .icon-hour-hand {
      transform-origin: 256px 256px;
      animation: iconHourSweep 24s linear infinite;
    }
    .icon-min-hand {
      transform-origin: 256px 256px;
      animation: iconMinuteSweep 2s linear infinite;
    }
  </style>

  <!-- Clean rounded white squircle badge for high visibility on dark and light browser tabs -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="#ffffff" stroke="#e2e8f0" stroke-width="8" filter="url(#iconShadow)"/>

  <!-- Outer Circular Ring (Exact thickness and proportions matching user loading icon) -->
  <circle cx="256" cy="256" r="170" stroke="#000000" stroke-width="48" fill="none" />

  <!-- Center Pivot Junction -->
  <circle cx="256" cy="256" r="24" fill="#000000" />

  <!-- Hour Hand (Starts at 135 deg / 4:30 position, sweeping smoothly) -->
  <g class="icon-hour-hand">
    <line x1="256" y1="256" x2="256" y2="152" stroke="#000000" stroke-width="48" stroke-linecap="round" transform="rotate(135 256 256)" />
  </g>

  <!-- Minute Hand (Sweeping smoothly 360 deg every 2 seconds matching transition cycle) -->
  <g class="icon-min-hand">
    <line x1="256" y1="256" x2="256" y2="116" stroke="#000000" stroke-width="48" stroke-linecap="round" />
  </g>
</svg>