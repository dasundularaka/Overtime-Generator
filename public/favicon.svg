<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    @keyframes favHourSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes favMinuteSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .fav-hour {
      transform-origin: 32px 32px;
      animation: favHourSweep 24s linear infinite;
    }
    .fav-min {
      transform-origin: 32px 32px;
      animation: favMinuteSweep 2s linear infinite;
    }
  </style>

  <!-- Crisp white circular badge with subtle border ensuring 100% contrast on dark and light browser tabs -->
  <circle cx="32" cy="32" r="30.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Outer Circular Ring (Exact thickness and proportions matching user loading clock) -->
  <circle cx="32" cy="32" r="22.5" stroke="#000000" stroke-width="6.5" fill="none" />

  <!-- Center Pivot Junction -->
  <circle cx="32" cy="32" r="3.25" fill="#000000" />

  <!-- Hour Hand (Starts at 135 deg / 4:30 position, progresses smoothly) -->
  <g class="fav-hour">
    <line x1="32" y1="32" x2="32" y2="19.5" stroke="#000000" stroke-width="6.5" stroke-linecap="round" transform="rotate(135 32 32)" />
  </g>

  <!-- Minute Hand (Sweeping smoothly 360 deg every 2 seconds matching transition cycle) -->
  <g class="fav-min">
    <line x1="32" y1="32" x2="32" y2="14.5" stroke="#000000" stroke-width="6.5" stroke-linecap="round" />
  </g>
</svg>
